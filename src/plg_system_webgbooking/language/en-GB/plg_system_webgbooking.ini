PLG_SYSTEM_WEBGBOOKING_ALERT_HOOKCFG_BODY="Booking no. %1$d: the event %2$s was not sent to the webhook. Reason: %3$s. Fix the element or the header profile; nothing is retried for this."
PLG_SYSTEM_WEBGBOOKING_CF_EXTRA_LABEL="Extra Cloudflare IP ranges"
PLG_SYSTEM_WEBGBOOKING_CF_EXTRA_DESC="The visitor address in the CF-Connecting-IP header is trusted only when the connection comes from a Cloudflare address. The plugin knows the current Cloudflare ranges; if Cloudflare publishes new ones, add them here (CIDR, one per line or comma separated, see cloudflare.com/ips)."
