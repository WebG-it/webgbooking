PLG_SYSTEM_WEBGBOOKING_EMAIL_MEET_PENDING="I will send you the video call link shortly, in a second email."
PLG_SYSTEM_WEBGBOOKING_LINKMAIL_SUBJECT="Your video call link"
PLG_SYSTEM_WEBGBOOKING_LINKMAIL_INTRO="here is the link for your appointment on %1$s at %2$s:"
PLG_SYSTEM_WEBGBOOKING_ICS_PHONE_GUEST="Phone appointment"
PLG_SYSTEM_WEBGBOOKING_PAY_REVIEW_BODY_MODE="Stripe recorded a payment in a different mode than the plugin's (test/live) for booking no. %7$d (%3$s, %4$s, %1$s at %2$s, %5$s). It was NOT confirmed. Check the mode and keys in the plugin options (ref. %6$s)."
PLG_SYSTEM_WEBGBOOKING_PAY_REVIEW_BODY_ORPHAN="Stripe collected %5$s from %3$s (%4$s) for booking no. %7$d on %1$s at %2$s, but that booking was no longer waiting (cancelled by the admin while the customer was paying). The payment is recorded on the row: refund by hand from Stripe (ref. %6$s) or recreate the appointment."
PLG_SYSTEM_WEBGBOOKING_ALERT_ORPHAN_SUBJECT="TO REVIEW: Stripe payment without a booking"
PLG_SYSTEM_WEBGBOOKING_ALERT_ORPHAN_BODY="Stripe collected a payment for session %1$s (ref. %2$s, amount %3$s, customer %4$s) but no booking is linked to it any more (deleted from the admin while the customer was paying). Refund by hand from Stripe or contact the customer."
PLG_SYSTEM_WEBGBOOKING_ALERT_PRICE_SUBJECT="WebG Booking: invalid price on an element"
PLG_SYSTEM_WEBGBOOKING_ALERT_PRICE_BODY="A booking element has a price or currency that cannot be read unambiguously (e.g. 49.999, or a currency other than EUR, USD, GBP, CHF). Its bookings are blocked until you fix it."
