PLG_SYSTEM_WEBGBOOKING_ALERT_GCAL_SUBJECT="WebG Booking: Google Calendar not answering, bookings paused"
PLG_SYSTEM_WEBGBOOKING_ALERT_GCAL_BODY="Google Calendar is connected but reading free/busy failed (%s). To avoid selling slots that are already taken the site offers no times until it answers again. Typical causes: Google access revoked or expired (reconnect in Components - WebG Booking - Google), quota or a temporary Google error. This alert is sent at most once every 6 hours."
PLG_SYSTEM_WEBGBOOKING_ALERT_FX_SUBJECT="WebG Booking: booking %1$s at %2$s has steps that did not complete"
