PLG_SYSTEM_WEBGBOOKING_MAIL_NOTE="All the emails of the plugin (customer and staff) use one layout. These options brand it; without them it is neutral: the site name at the top and a blue accent. The text you write in an element goes into the body of the layout, it does not replace it."
