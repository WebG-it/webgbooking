; --- Stripe payments (added 0.32.0) ---
PLG_SYSTEM_WEBGBOOKING_PAY_FIELDSET="Payments (Stripe)"
PLG_SYSTEM_WEBGBOOKING_PAY_DESC="For paid events (the element's Price field). On confirm the slot is held, the customer pays on Stripe Checkout and ONLY once the payment is confirmed the Google event, emails, reminders, Sheet and webhook run. The receipt is Stripe's. Register the webhook URL below in Stripe (events checkout.session.completed and checkout.session.expired) and paste its signing secret."
PLG_SYSTEM_WEBGBOOKING_PAY_MODE_LABEL="Mode"
PLG_SYSTEM_WEBGBOOKING_PAY_MODE_DESC="Test or live: must match the key (sk_test_ or sk_live_). Events of the wrong mode are ignored."
PLG_SYSTEM_WEBGBOOKING_PAY_MODE_TEST="Test"
PLG_SYSTEM_WEBGBOOKING_PAY_MODE_LIVE="Live"
PLG_SYSTEM_WEBGBOOKING_PAY_PK_LABEL="Publishable key"
PLG_SYSTEM_WEBGBOOKING_PAY_PK_DESC="pk_test_... or pk_live_...: public by nature. Stripe Checkout (redirect) does not need it, kept for reference."
PLG_SYSTEM_WEBGBOOKING_PAY_SK_LABEL="Secret key"
PLG_SYSTEM_WEBGBOOKING_PAY_SK_DESC="sk_... (or a restricted key rk_...). Encrypted in the database and never sent back to the form. Empty = keep the stored one; type a dash (-) to delete it. It is checked with Stripe on save."
PLG_SYSTEM_WEBGBOOKING_PAY_WHSEC_LABEL="Webhook signing secret"
PLG_SYSTEM_WEBGBOOKING_PAY_WHSEC_DESC="whsec_... of the endpoint created on Stripe. Encrypted like the secret key. Without it every webhook is rejected."
PLG_SYSTEM_WEBGBOOKING_PAY_WEBHOOK_LABEL="Webhook URL to register on Stripe"
PLG_SYSTEM_WEBGBOOKING_PAY_WEBHOOK_DESC="Stripe → Developers → Webhooks → Add endpoint: paste this URL and pick the events checkout.session.completed, checkout.session.expired (checkout.session.async_payment_succeeded and checkout.session.async_payment_failed are recommended too)."
PLG_SYSTEM_WEBGBOOKING_PAY_HOLD_LABEL="Hold the slot for (minutes)"
PLG_SYSTEM_WEBGBOOKING_PAY_HOLD_DESC="How long the slot stays reserved while waiting for the payment (minimum 30, imposed by Stripe). After that it is free again."
PLG_SYSTEM_WEBGBOOKING_PAY_CANCEL_LABEL="Free cancellation up to (hours before)"
PLG_SYSTEM_WEBGBOOKING_PAY_CANCEL_DESC="For PAID bookings the customer can cancel or move by themselves up to this notice; after that they must contact you. Refunds are made by hand from Stripe."
