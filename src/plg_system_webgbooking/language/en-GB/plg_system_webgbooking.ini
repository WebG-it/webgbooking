PLG_SYSTEM_WEBGBOOKING_ALERT_FX_GAVEUP="After 10 attempts it gave up: fix it by hand."
PLG_SYSTEM_WEBGBOOKING_ALERT_FX_WILLRETRY="The scheduled task retries by itself every few minutes, only the missing steps."
PLG_SYSTEM_WEBGBOOKING_EMAIL_MEET_PENDING="I will send you the video call link shortly, in a second email."
PLG_SYSTEM_WEBGBOOKING_LINKMAIL_SUBJECT="Your video call link"
PLG_SYSTEM_WEBGBOOKING_LINKMAIL_INTRO="here is the link for your appointment on %1$s at %2$s:"
PLG_SYSTEM_WEBGBOOKING_ICS_PHONE_GUEST="Phone appointment"
PLG_SYSTEM_WEBGBOOKING_PAY_REVIEW_BODY_MODE="Stripe recorded a payment in a different mode than the plugin's (test/live) for booking no. %7$d (%3$s, %4$s, %1$s at %2$s, %5$s). It was NOT confirmed. Check the mode and keys in the plugin options (ref. %6$s)."
PLG_SYSTEM_WEBGBOOKING_PAY_REVIEW_BODY_ORPHAN="Stripe collected %5$s from %3$s (%4$s) for booking no. %7$d on %1$s at %2$s, but that booking was no longer waiting (cancelled by the admin while the customer was paying). The payment is recorded on the row: refund by hand from Stripe (ref. %6$s) or recreate the appointment."
PLG_SYSTEM_WEBGBOOKING_ALERT_ORPHAN_SUBJECT="TO REVIEW: Stripe payment without a booking"
PLG_SYSTEM_WEBGBOOKING_ALERT_ORPHAN_BODY="Stripe collected a payment for session %1$s (ref. %2$s, amount %3$s, customer %4$s) but no booking is linked to it any more (deleted from the admin while the customer was paying). Refund by hand from Stripe or contact the customer."
PLG_SYSTEM_WEBGBOOKING_ALERT_PRICE_SUBJECT="WebG Booking: invalid price on an element"
PLG_SYSTEM_WEBGBOOKING_ALERT_PRICE_BODY="A booking element has a price or currency that cannot be read unambiguously (e.g. 49.999, or a currency other than EUR, USD, GBP, CHF). Its bookings are blocked until you fix it."
PLG_SYSTEM_WEBGBOOKING_ALERT_KEYMODE_SUBJECT="WebG Booking: Stripe key and mode do not match"
PLG_SYSTEM_WEBGBOOKING_ALERT_KEYMODE_BODY="The Stripe secret key belongs to a different mode (test or live) than the one set in the plugin: payments are refused. Fix it in the plugin options, Payments tab."
PLG_SYSTEM_WEBGBOOKING_ALERT_HOLDS_SUBJECT="WebG Booking: open payment holds cap reached"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOLDS_BODY="%d slots are held waiting for payment: new paid requests are refused until they expire. If this is not a rush of real customers, someone is trying to block the calendar."
PLG_SYSTEM_WEBGBOOKING_TOO_MANY="Too many requests in a short time: please try again in a few minutes."
PLG_SYSTEM_WEBGBOOKING_PRICE_INVALID="The price of this event is not configured correctly: bookings are paused."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_MODE_ERROR="The secret key is a \"%1$s\" key but the chosen mode is \"%2$s\": NOT saved (the previous settings stay). Pick the right mode or the right key."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_OK_RESTRICTED="Stripe restricted key verified (it can read Checkout sessions)."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_UNVERIFIABLE="Saved, but Stripe does not let this restricted key be verified (no read permission). It only works if it has Checkout Sessions write permission: try a test payment."
PLG_SYSTEM_WEBGBOOKING_EPOCH_BUMPED="Cached configurations invalidated (version %d): pages already generated stop booking until they are regenerated. Clear the page cache (and Cloudflare)."
