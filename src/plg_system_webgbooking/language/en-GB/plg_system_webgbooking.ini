PLG_SYSTEM_WEBGBOOKING_HOLDS_MAX_DESC="Global cap of held slots: above it new paid requests are refused and you get an alert (protects against calendar blocking)."
PLG_SYSTEM_WEBGBOOKING_GTM_LABEL="Google Tag Manager (GTM-XXXX)"
PLG_SYSTEM_WEBGBOOKING_GTM_DESC="Optional. Only used by the Stripe return page when the element has NO thank-you page: it loads your GTM container there so the booking-completed event (with value and currency) still fires."
PLG_SYSTEM_WEBGBOOKING_GA4_LABEL="Google Analytics 4 (G-XXXX)"
PLG_SYSTEM_WEBGBOOKING_GA4_DESC="Optional, alternative to GTM for the return page without a thank-you page."
PLG_SYSTEM_WEBGBOOKING_EPOCH_LABEL="Configuration version"
PLG_SYSTEM_WEBGBOOKING_EPOCH_DESC="Current number (read only). Every page carries a configuration signed with this version."
PLG_SYSTEM_WEBGBOOKING_BUMP_LABEL="Invalidate cached configurations on save"
PLG_SYSTEM_WEBGBOOKING_BUMP_DESC="Set to Yes and save every time you change an element's PRICE (or turn it from free to paid): cached copies of the page stop booking with the old configuration. Then clear the cache."
PLG_SYSTEM_WEBGBOOKING_TTL_LABEL="Maximum age of a configuration (days)"
PLG_SYSTEM_WEBGBOOKING_TTL_DESC="Safety net: a cached page older than this no longer books (the customer sees 'reload the page'). 30 days survives even a monthly Cloudflare rule; 0 = no limit."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_PREFIX_ERROR="The secret key does not have a recognised Stripe prefix (sk_test_, sk_live_, rk_test_, rk_live_): NOT saved, the previous one stays."
; 0.33.2: free bookings are confirmed at once; the request wording is kept for elements with manual confirmation
PLG_SYSTEM_WEBGBOOKING_EMAIL_CUSTOMER_SUBJECT_REQUEST="Your booking request"
PLG_SYSTEM_WEBGBOOKING_EMAIL_REQUEST="we have registered your appointment request. Here are the details:"
PLG_SYSTEM_WEBGBOOKING_BOOK_OK_CONFIRMED="Booking confirmed! You will receive an email with the details and the link to join the call on the selected day."
PLG_SYSTEM_WEBGBOOKING_BOOK_OK_PHONE_CONFIRMED="Booking confirmed! You will receive an email with the details: I will call you on the number you gave, on the chosen day and time."
PLG_SYSTEM_WEBGBOOKING_INT_FIELDSET="Integrations"
PLG_SYSTEM_WEBGBOOKING_BREVO_FIELDSET="Brevo (email marketing)"
PLG_SYSTEM_WEBGBOOKING_BREVO_DESC="Add the people who book to Brevo as contacts, optionally on a list and with double opt-in. Turn it on per element (Actions tab, Brevo group). The API key is stored encrypted and is never shown again. Failures never reach the customer: they go to the log (administrator/logs/webgbooking.php) and to an email to the staff."
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_LABEL="Brevo API key"
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_DESC="Brevo > SMTP and API > API keys. Checked at once when you save (GET /v3/account). Empty = keep the saved one, a single dash = remove it."
PLG_SYSTEM_WEBGBOOKING_BREVO_ATTR_FIRST_LABEL="Attribute: first name"
PLG_SYSTEM_WEBGBOOKING_BREVO_ATTR_DESC="The names of the contact attributes in YOUR Brevo account (Contacts > Settings > Contact attributes). Italian accounts use NOME / COGNOME / SMS, English ones FIRSTNAME / LASTNAME / SMS. The first word of the name is the first name, the rest the surname."
PLG_SYSTEM_WEBGBOOKING_BREVO_ATTR_LAST_LABEL="Attribute: surname"
PLG_SYSTEM_WEBGBOOKING_BREVO_ATTR_SMS_LABEL="Attribute: mobile (SMS)"
PLG_SYSTEM_WEBGBOOKING_BREVO_CC_LABEL="Default country code"
PLG_SYSTEM_WEBGBOOKING_BREVO_CC_DESC="Used to turn a phone number typed without a prefix into E.164 (+39...). Empty = only numbers that already start with + or 00 are sent. A number that cannot be made valid is simply not sent."
PLG_SYSTEM_WEBGBOOKING_WHP_FIELDSET="Webhook header profiles"
PLG_SYSTEM_WEBGBOOKING_WHP_DESC="Up to four named profiles with the headers a webhook needs (Authorization, X-Api-Key ...). The element only stores the profile NAME: the headers stay encrypted on the server and never appear in the page. One per line, "_QQ_"Header: value"_QQ_". An optional line "_QQ_"URL: https://..."_QQ_" gives the endpoint too (useful when the address itself is a secret, like Zapier or Make hooks); the element URL wins over it."
PLG_SYSTEM_WEBGBOOKING_WHP_GLOBAL_LABEL="Profile of the plugin-wide webhook"
PLG_SYSTEM_WEBGBOOKING_WHP_GLOBAL_DESC="Name of the profile used by the Bookings webhook (Basic tab). Never sent to an address an element chose for itself."
PLG_SYSTEM_WEBGBOOKING_WHP_NAME_LABEL="Profile name"
PLG_SYSTEM_WEBGBOOKING_WHP_HEADERS_LABEL="Headers (secret)"
PLG_SYSTEM_WEBGBOOKING_WHP_HEADERS_DESC="Example: Authorization: Bearer abc123 (a new line for each header, at most 6; Host, Content-Type, Content-Length and similar are ignored). Empty = keep, a single dash = remove."
PLG_SYSTEM_WEBGBOOKING_WHP_HEADERS_EMPTY="Authorization: Bearer ..."
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_OK="Brevo key checked: account %s."
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_UNVERIFIABLE="Brevo key saved but it could not be checked now (Brevo did not answer): try again later."
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_BAD="Brevo refused this key (HTTP %d): it was saved, check it."
PLG_SYSTEM_WEBGBOOKING_WHP_SAVED="Header profile "_QQ_"%1$s"_QQ_": %2$d valid header(s) saved."
PLG_SYSTEM_WEBGBOOKING_ALERT_BREVO_SUBJECT="WebG Booking: a booker was not added to Brevo"
PLG_SYSTEM_WEBGBOOKING_ALERT_BREVO_BODY="Booking no. %1$d (%2$s, %3$s): the contact was not saved in Brevo. Reason: %4$s. A retry would not help: fix the setting, then add the contact by hand."
PLG_SYSTEM_WEBGBOOKING_ALERT_HOOK_SUBJECT="WebG Booking: a webhook call was not delivered"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOOK_BODY="Booking no. %1$d: the event %2$s could not be delivered to the webhook after 8 attempts. Your CRM may be out of date for this booking."
