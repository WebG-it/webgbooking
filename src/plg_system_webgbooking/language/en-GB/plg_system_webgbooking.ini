PLG_SYSTEM_WEBGBOOKING_MAIL_BUTTON_COLOR_LABEL="Button colour"
PLG_SYSTEM_WEBGBOOKING_MAIL_BUTTON_COLOR_DESC="As #rrggbb. Empty = the main colour. The text of the button turns white or black by itself."
PLG_SYSTEM_WEBGBOOKING_MAIL_FOOTER_LABEL="Footer text"
