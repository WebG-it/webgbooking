PLG_SYSTEM_WEBGBOOKING_MAIL_LOGO_DARK_DESC="Used instead of the logo by email programs in dark mode. Empty = the same logo on a white background."
PLG_SYSTEM_WEBGBOOKING_MAIL_COLOR_LABEL="Main colour"
