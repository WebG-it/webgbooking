PLG_SYSTEM_WEBGBOOKING_ALERT_KEYMODE_BODY="The Stripe secret key belongs to a different mode (test or live) than the one set in the plugin: payments are refused. Fix it in the plugin options, Payments tab."
PLG_SYSTEM_WEBGBOOKING_ALERT_HOLDS_SUBJECT="WebG Booking: open payment holds cap reached"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOLDS_BODY="%d slots are held waiting for payment: new paid requests are refused until they expire. If this is not a rush of real customers, someone is trying to block the calendar."
