PLG_SYSTEM_WEBGBOOKING_ALERT_BREVO_BODY="Booking no. %1$d (%2$s, %3$s): the contact was not saved in Brevo. Reason: %4$s. A retry would not help: fix the setting, then add the contact by hand."
PLG_SYSTEM_WEBGBOOKING_ALERT_HOOK_SUBJECT="WebG Booking: a webhook call was not delivered"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOOK_BODY="Booking no. %1$d: the event %2$s could not be delivered to the webhook after 8 attempts. Your CRM may be out of date for this booking."
