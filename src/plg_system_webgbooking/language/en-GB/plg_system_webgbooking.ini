PLG_SYSTEM_WEBGBOOKING_MAIL_FROM_NAME_LABEL="Sender name"
PLG_SYSTEM_WEBGBOOKING_MAIL_FROM_NAME_DESC="Name shown as the sender of these emails. Empty = the name in the Joomla global configuration."
PLG_SYSTEM_WEBGBOOKING_MAIL_LINE_COLOR_LABEL="Top line colour"
PLG_SYSTEM_WEBGBOOKING_MAIL_LINE_COLOR_DESC="As #rrggbb. Empty = the main colour."
PLG_SYSTEM_WEBGBOOKING_MAIL_LINK_COLOR_LABEL="Link colour"
PLG_SYSTEM_WEBGBOOKING_MAIL_LINK_COLOR_DESC="As #rrggbb. Empty = the main colour, darkened if needed. It is always darkened until it reads well on white."
PLG_SYSTEM_WEBGBOOKING_MAIL_TEXT_COLOR_LABEL="Text colour"
PLG_SYSTEM_WEBGBOOKING_MAIL_TEXT_COLOR_DESC="As #rrggbb, for titles and text in light mode. Empty = dark grey. Ignored if it does not read well on white."
PLG_SYSTEM_WEBGBOOKING_MAIL_FOOTER_COLOR_LABEL="Footer background"
PLG_SYSTEM_WEBGBOOKING_MAIL_FOOTER_COLOR_DESC="As #rrggbb. Empty = dark blue-grey. The text of the footer turns light or dark by itself."
