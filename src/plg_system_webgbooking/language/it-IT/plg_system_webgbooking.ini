PLG_SYSTEM_WEBGBOOKING_EL_OPTIONAL_THE_NAME_OF="Facoltativo. Il NOME di un profilo di intestazioni salvato nelle opzioni del plugin (scheda Integrazioni): le sue intestazioni (Authorization, X-Api-Key ...) vengono aggiunte alla chiamata, ma SOLO se la chiamata va all'indirizzo di quel profilo (la sua riga \"URL:\") o a un host della sua riga \"HOSTS:\". Lascia vuoto l'URL del webhook qui sopra per usare l'indirizzo del profilo. La pagina conserva solo il nome."
