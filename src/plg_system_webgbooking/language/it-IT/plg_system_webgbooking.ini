; --- Pagamenti Stripe (aggiunto 0.32.0) ---
PLG_SYSTEM_WEBGBOOKING_PAY_FIELDSET="Pagamenti (Stripe)"
PLG_SYSTEM_WEBGBOOKING_PAY_DESC="Per gli eventi a pagamento (campo Prezzo dell'elemento). Al \"conferma\" lo slot viene tenuto, il cliente paga su Stripe Checkout e SOLO a pagamento confermato partono evento Google, email, promemoria, Sheet e webhook. La ricevuta è quella di Stripe. Registra su Stripe l'URL del webhook qui sotto (eventi checkout.session.completed e checkout.session.expired) e incolla il suo segreto di firma."
PLG_SYSTEM_WEBGBOOKING_PAY_MODE_LABEL="Modalità"
PLG_SYSTEM_WEBGBOOKING_PAY_MODE_DESC="Test o produzione: deve corrispondere alla chiave (sk_test_ o sk_live_). Gli eventi del modo sbagliato vengono ignorati."
PLG_SYSTEM_WEBGBOOKING_PAY_MODE_TEST="Test"
PLG_SYSTEM_WEBGBOOKING_PAY_MODE_LIVE="Produzione"
PLG_SYSTEM_WEBGBOOKING_PAY_PK_LABEL="Chiave pubblicabile"
PLG_SYSTEM_WEBGBOOKING_PAY_PK_DESC="pk_test_... o pk_live_...: pubblica per natura. Con Stripe Checkout (redirect) non serve al flusso, la teniamo per riferimento."
PLG_SYSTEM_WEBGBOOKING_PAY_SK_LABEL="Chiave segreta"
PLG_SYSTEM_WEBGBOOKING_PAY_SK_DESC="sk_... (o una chiave limitata rk_...). Viene cifrata nel database e non torna mai nel form. Campo vuoto = lascia quella salvata; scrivi un trattino (-) per cancellarla. Al salvataggio viene verificata con Stripe."
PLG_SYSTEM_WEBGBOOKING_PAY_WHSEC_LABEL="Segreto di firma del webhook"
PLG_SYSTEM_WEBGBOOKING_PAY_WHSEC_DESC="whsec_... dell'endpoint creato su Stripe. Cifrato come la chiave segreta. Senza questo segreto ogni webhook viene rifiutato."
PLG_SYSTEM_WEBGBOOKING_PAY_WEBHOOK_LABEL="URL del webhook da registrare su Stripe"
PLG_SYSTEM_WEBGBOOKING_PAY_WEBHOOK_DESC="Stripe → Sviluppatori → Webhook → Aggiungi endpoint: incolla questo URL e scegli gli eventi checkout.session.completed, checkout.session.expired (consigliati anche checkout.session.async_payment_succeeded e checkout.session.async_payment_failed)."
PLG_SYSTEM_WEBGBOOKING_PAY_HOLD_LABEL="Slot tenuto per (minuti)"
PLG_SYSTEM_WEBGBOOKING_PAY_HOLD_DESC="Quanto resta riservato lo slot in attesa del pagamento (minimo 30, imposto da Stripe). Passato questo tempo torna libero."
PLG_SYSTEM_WEBGBOOKING_PAY_CANCEL_LABEL="Annullo gratuito fino a (ore prima)"
PLG_SYSTEM_WEBGBOOKING_PAY_CANCEL_DESC="Per le prenotazioni PAGATE il cliente può annullare o spostare da solo fino a questo preavviso; dopo deve contattarti. I rimborsi si fanno a mano da Stripe."
