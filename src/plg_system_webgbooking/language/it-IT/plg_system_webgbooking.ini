PLG_SYSTEM_WEBGBOOKING_EL_OPTIONAL_AFTER_A_COMPLETED="Facoltativo. Dopo una prenotazione completata (per un evento a pagamento: dopo la conferma del pagamento) chi prenota viene portato a questa pagina. Vuoto = la conferma resta nel widget. URL assoluto https:// oppure un percorso come /grazie."
