PLG_SYSTEM_WEBGBOOKING_EL_GOOGLE_MEET_A_MEET="Google Meet: viene creato un link Meet. Telefonata: chi prenota deve indicare un numero di telefono e lo chiami tu (nessun link; il numero compare nel titolo dell'evento, nelle email e nel file .ics). Scelta del cliente: il widget fa scegliere una delle due."
