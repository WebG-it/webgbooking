PLG_SYSTEM_WEBGBOOKING_PAY_REVIEW_BODY_MODE="Stripe ha registrato un pagamento in modalità diversa da quella del plugin (test/produzione) per la prenotazione n. %7$d (%3$s, %4$s, %1$s alle %2$s, %5$s). NON è stata confermata. Controlla la modalità e le chiavi nelle opzioni del plugin (rif. %6$s)."
PLG_SYSTEM_WEBGBOOKING_PAY_REVIEW_BODY_ORPHAN="Stripe ha incassato %5$s da %3$s (%4$s) per la prenotazione n. %7$d del %1$s alle %2$s, ma quella prenotazione non era più in attesa (annullata dall'admin mentre il cliente pagava). Il pagamento è registrato sulla riga: rimborsa a mano da Stripe (rif. %6$s) oppure ricrea l'appuntamento."
PLG_SYSTEM_WEBGBOOKING_ALERT_ORPHAN_SUBJECT="DA GESTIRE: pagamento Stripe senza prenotazione"
PLG_SYSTEM_WEBGBOOKING_ALERT_ORPHAN_BODY="Stripe ha incassato un pagamento per la sessione %1$s (rif. %2$s, importo %3$s, cliente %4$s) ma non esiste più nessuna prenotazione collegata (eliminata dall'admin mentre il cliente pagava). Rimborsa a mano da Stripe o contatta il cliente."
PLG_SYSTEM_WEBGBOOKING_ALERT_PRICE_SUBJECT="WebG Booking: prezzo di un elemento non valido"
PLG_SYSTEM_WEBGBOOKING_ALERT_PRICE_BODY="Un elemento booking ha un prezzo o una valuta che non si riesce a leggere in modo univoco (es. 49.999, oppure una valuta diversa da EUR, USD, GBP, CHF). Le sue prenotazioni sono bloccate finché non lo correggi."
PLG_SYSTEM_WEBGBOOKING_ALERT_KEYMODE_SUBJECT="WebG Booking: chiave Stripe e modalità non coincidono"
PLG_SYSTEM_WEBGBOOKING_ALERT_KEYMODE_BODY="La chiave segreta Stripe è di un modo (test o produzione) diverso da quello impostato nel plugin: i pagamenti sono rifiutati. Correggi nelle opzioni del plugin, scheda Payments."
PLG_SYSTEM_WEBGBOOKING_ALERT_HOLDS_SUBJECT="WebG Booking: tetto di pagamenti in attesa raggiunto"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOLDS_BODY="Ci sono %d slot tenuti in attesa di pagamento: nuove richieste a pagamento sono rifiutate finché non scadono. Se non è un picco di richieste vere, qualcuno sta provando a bloccare il calendario."
PLG_SYSTEM_WEBGBOOKING_TOO_MANY="Troppe richieste ravvicinate: riprova tra qualche minuto."
PLG_SYSTEM_WEBGBOOKING_PRICE_INVALID="Il prezzo di questo evento non è configurato correttamente: le prenotazioni sono sospese."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_MODE_ERROR="La chiave segreta è di tipo \"%1$s\" ma la modalità scelta è \"%2$s\": NON salvate (restano le impostazioni precedenti). Scegli la modalità giusta o la chiave giusta."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_OK_RESTRICTED="Chiave limitata Stripe verificata (può leggere le sessioni di Checkout)."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_UNVERIFIABLE="Salvata, ma Stripe non permette a questa chiave limitata di essere verificata (nessun permesso di lettura). Funziona solo se ha il permesso Checkout Sessions in scrittura: prova con un pagamento di prova."
PLG_SYSTEM_WEBGBOOKING_EPOCH_BUMPED="Configurazioni in cache invalidate (versione %d): le pagine già generate smettono di prenotare finché non vengono rigenerate. Svuota la cache della pagina (e Cloudflare)."
PLG_SYSTEM_WEBGBOOKING_LIMIT_IP_LABEL="Prenotazioni per indirizzo IP all'ora"
PLG_SYSTEM_WEBGBOOKING_LIMIT_IP_DESC="Oltre questo numero lo stesso indirizzo viene rifiutato per un'ora. L'IP non viene salvato, solo una sua impronta."
PLG_SYSTEM_WEBGBOOKING_HOLDS_IP_LABEL="Slot in attesa di pagamento per IP"
PLG_SYSTEM_WEBGBOOKING_HOLDS_IP_DESC="Quanti pagamenti aperti può avere lo stesso indirizzo contemporaneamente."
PLG_SYSTEM_WEBGBOOKING_HOLDS_MAX_LABEL="Tetto di slot in attesa di pagamento"
PLG_SYSTEM_WEBGBOOKING_HOLDS_MAX_DESC="Tetto globale di slot tenuti: oltre, le nuove richieste a pagamento sono rifiutate e ti arriva un avviso (protegge dal blocco del calendario)."
PLG_SYSTEM_WEBGBOOKING_GTM_LABEL="Google Tag Manager (GTM-XXXX)"
PLG_SYSTEM_WEBGBOOKING_GTM_DESC="Facoltativo. Serve solo alla pagina di ritorno di Stripe quando l'elemento NON ha una pagina grazie: ci carica il tuo contenitore GTM così l'evento di prenotazione completata (con valore e valuta) parte comunque."
PLG_SYSTEM_WEBGBOOKING_GA4_LABEL="Google Analytics 4 (G-XXXX)"
PLG_SYSTEM_WEBGBOOKING_GA4_DESC="Facoltativo, alternativa a GTM per la pagina di ritorno senza pagina grazie."
PLG_SYSTEM_WEBGBOOKING_EPOCH_LABEL="Versione delle configurazioni"
PLG_SYSTEM_WEBGBOOKING_EPOCH_DESC="Numero corrente (sola lettura). Ogni pagina porta una configurazione firmata con questa versione."
PLG_SYSTEM_WEBGBOOKING_BUMP_LABEL="Invalida le configurazioni in cache al salvataggio"
PLG_SYSTEM_WEBGBOOKING_BUMP_DESC="Mettilo su Si e salva ogni volta che cambi il PREZZO di un elemento (o lo passi da gratis a pagamento): le copie della pagina in cache smettono di prenotare con la configurazione vecchia. Poi svuota la cache."
PLG_SYSTEM_WEBGBOOKING_TTL_LABEL="Durata massima di una configurazione (giorni)"
PLG_SYSTEM_WEBGBOOKING_TTL_DESC="Rete di sicurezza: una pagina in cache più vecchia di questo non prenota più (il cliente vede 'ricarica la pagina'). 30 giorni sopravvivono anche a una regola Cloudflare mensile; 0 = nessun limite."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_PREFIX_ERROR="La chiave segreta non ha un prefisso Stripe riconosciuto (sk_test_, sk_live_, rk_test_, rk_live_): NON salvata, resta quella precedente."
; 0.33.2: le prenotazioni gratuite sono confermate subito; il testo richiesta resta per gli elementi con conferma manuale
PLG_SYSTEM_WEBGBOOKING_EMAIL_CUSTOMER_SUBJECT_REQUEST="La tua richiesta di prenotazione"
PLG_SYSTEM_WEBGBOOKING_EMAIL_REQUEST="abbiamo registrato la tua richiesta di appuntamento. Ecco i dettagli:"
PLG_SYSTEM_WEBGBOOKING_BOOK_OK_CONFIRMED="Prenotazione confermata! Riceverai un'email con i dettagli e il link per partecipare alla call nel giorno scelto."
PLG_SYSTEM_WEBGBOOKING_BOOK_OK_PHONE_CONFIRMED="Prenotazione confermata! Riceverai un'email con i dettagli: ti chiamo io al numero che hai indicato, nel giorno e all'ora scelti."
PLG_SYSTEM_WEBGBOOKING_INT_FIELDSET="Integrazioni"
PLG_SYSTEM_WEBGBOOKING_BREVO_FIELDSET="Brevo (email marketing)"
PLG_SYSTEM_WEBGBOOKING_BREVO_DESC="Aggiunge a Brevo come contatti le persone che prenotano. Una persona finisce in una lista SOLO se spunta la newsletter E conferma con il double opt-in di Brevo (nell'elemento serve l'id del modello); altrimenti al massimo si salva un contatto senza liste, e un contatto che esiste già non viene mai sovrascritto. Si attiva per elemento (scheda Actions, gruppo Brevo). La chiave API viene salvata cifrata e non viene mai mostrata di nuovo. Gli errori non arrivano mai al cliente: vanno nel registro (administrator/logs/webgbooking.php) e in una email allo staff."
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_LABEL="Chiave API Brevo"
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_DESC="Brevo > SMTP e API > Chiavi API. Viene verificata subito al salvataggio (GET /v3/account). Vuoto = tieni quella salvata, un solo trattino = rimuovila."
PLG_SYSTEM_WEBGBOOKING_BREVO_ATTR_FIRST_LABEL="Attributo: nome"
PLG_SYSTEM_WEBGBOOKING_BREVO_ATTR_DESC="I nomi degli attributi dei contatti nel TUO account Brevo (Contatti > Impostazioni > Attributi). Gli account in italiano usano NOME / COGNOME / SMS, quelli in inglese FIRSTNAME / LASTNAME / SMS. La prima parola del nome è il nome, il resto il cognome."
PLG_SYSTEM_WEBGBOOKING_BREVO_ATTR_LAST_LABEL="Attributo: cognome"
PLG_SYSTEM_WEBGBOOKING_BREVO_ATTR_SMS_LABEL="Attributo: cellulare (SMS)"
PLG_SYSTEM_WEBGBOOKING_BREVO_CC_LABEL="Prefisso internazionale predefinito"
PLG_SYSTEM_WEBGBOOKING_BREVO_CC_DESC="Serve a trasformare un numero scritto senza prefisso in formato E.164 (+39...). Vuoto = si inviano solo i numeri che iniziano già con + o 00. Un numero che non diventa valido semplicemente non viene inviato."
PLG_SYSTEM_WEBGBOOKING_WHP_FIELDSET="Profili di intestazioni per i webhook"
PLG_SYSTEM_WEBGBOOKING_WHP_DESC="Fino a quattro profili con nome e le intestazioni che un webhook richiede (Authorization, X-Api-Key ...). L'elemento salva solo il NOME del profilo: le intestazioni restano cifrate sul server e non compaiono mai nella pagina. Una per riga, \"Intestazione: valore\". Le intestazioni partono SOLO verso l'indirizzo del profilo: una riga \"URL: https://...\" (utile anche quando l'indirizzo è un segreto, come i hook di Zapier o Make), oppure, per il profilo generale, l'indirizzo del webhook generale. Una riga facoltativa \"HOSTS: a.esempio.it, b.esempio.it\" permette a un elemento di usare un proprio indirizzo su quegli host. Non elencare mai un host condiviso fra clienti (hooks.zapier.com, hook.eu1.make.com e simili): chiunque usi lo stesso servizio potrebbe ricevere queste intestazioni. Per quei servizi usa la riga \"URL:\". Le intestazioni viaggiano solo su https. Se il profilo non esiste o non si decifra, non parte nulla e lo staff viene avvisato."
PLG_SYSTEM_WEBGBOOKING_WHP_GLOBAL_LABEL="Profilo del webhook generale del plugin"
PLG_SYSTEM_WEBGBOOKING_WHP_GLOBAL_DESC="Nome del profilo usato dal webhook delle prenotazioni (scheda Base). Non viene mai inviato a un indirizzo scelto da un elemento."
PLG_SYSTEM_WEBGBOOKING_WHP_NAME_LABEL="Nome del profilo"
PLG_SYSTEM_WEBGBOOKING_WHP_HEADERS_LABEL="Intestazioni (segrete)"
PLG_SYSTEM_WEBGBOOKING_WHP_HEADERS_DESC="Esempio: Authorization: Bearer abc123 (una riga per ogni intestazione, al massimo 6; Host, Content-Type, Content-Length e simili vengono ignorate). Vuoto = tieni, un solo trattino = rimuovi."
PLG_SYSTEM_WEBGBOOKING_WHP_HEADERS_EMPTY="Authorization: Bearer ..."
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_OK="Chiave Brevo verificata: account %s."
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_UNVERIFIABLE="Chiave Brevo salvata ma ora non è stato possibile verificarla (Brevo non ha risposto): riprova più tardi."
PLG_SYSTEM_WEBGBOOKING_BREVO_KEY_BAD="Brevo ha rifiutato questa chiave (HTTP %d): è stata salvata, controllala."
PLG_SYSTEM_WEBGBOOKING_WHP_SAVED="Profilo di intestazioni \"%1$s\": %2$d intestazioni valide salvate."
PLG_SYSTEM_WEBGBOOKING_ALERT_BREVO_SUBJECT="WebG Booking: una persona non è stata aggiunta a Brevo"
PLG_SYSTEM_WEBGBOOKING_ALERT_BREVO_BODY="Prenotazione n. %1$d (%2$s, %3$s): il contatto non è stato salvato su Brevo. Motivo: %4$s. Un nuovo tentativo non servirebbe: correggi l'impostazione, poi aggiungi il contatto a mano."
PLG_SYSTEM_WEBGBOOKING_ALERT_HOOK_SUBJECT="WebG Booking: una chiamata al webhook non è stata consegnata"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOOK_BODY="Prenotazione n. %1$d: l'evento %2$s non è stato consegnato al webhook dopo 8 tentativi. Il tuo CRM potrebbe non essere aggiornato su questa prenotazione."
PLG_SYSTEM_WEBGBOOKING_EMAIL_ADMIN_SUBJECT_MOVED="Appuntamento spostato: %1$s alle %2$s"
PLG_SYSTEM_WEBGBOOKING_EMAIL_ADMIN_MOVED_INTRO="Il cliente ha spostato questo appuntamento (era il %1$s alle %2$s). Nuovi dettagli:"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOOKCFG_SUBJECT="WebG Booking: una chiamata al webhook NON è stata inviata (configurazione)"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOOKCFG_BODY="Prenotazione n. %1$d: l'evento %2$s non è stato inviato al webhook. Motivo: %3$s. Correggi l'elemento o il profilo di intestazioni; per questo non si riprova."
PLG_SYSTEM_WEBGBOOKING_CF_EXTRA_LABEL="Altri intervalli IP di Cloudflare"
PLG_SYSTEM_WEBGBOOKING_CF_EXTRA_DESC="L'indirizzo del visitatore nell'intestazione CF-Connecting-IP viene creduto solo quando la connessione arriva da un indirizzo di Cloudflare. Il plugin conosce gli intervalli attuali; se Cloudflare ne pubblica di nuovi, aggiungili qui (CIDR, uno per riga o separati da virgola, vedi cloudflare.com/ips)."
