PLG_SYSTEM_WEBGBOOKING_EL_PAID_EVENT_THE_AMOUNT="Evento a pagamento: l'importo da addebitare con Stripe Checkout alla prenotazione, ad esempio <code>49</code> oppure <code>29,00</code> (al massimo due decimali; un valore ambiguo come 49.999 blocca le prenotazioni finché non viene corretto). Vuoto o 0 = evento gratuito. Servono le chiavi Stripe nelle opzioni del plugin (scheda Pagamenti). Cambi un prezzo? Usa \"Invalida le configurazioni in cache\" nelle opzioni del plugin così le copie in cache della pagina smettono di usare il vecchio."
