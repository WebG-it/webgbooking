PLG_SYSTEM_WEBGBOOKING_EL_NEWSLETTER_TICK_THE_CONTACT="Spunta newsletter: il contatto viene salvato solo se il cliente spunta la casella. Ogni prenotazione: viene creato un contatto per CHIUNQUE prenoti, anche senza consenso marketing (è solo una scheda contatto, nessuna lista, nessuna email; un contatto che esiste già in Brevo non viene toccato). Senza la spunta viene salvato SENZA liste quando non spunta (un contatto che esiste già in Brevo non viene toccato)."
