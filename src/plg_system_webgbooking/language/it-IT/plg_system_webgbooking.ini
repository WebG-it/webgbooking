PLG_SYSTEM_WEBGBOOKING_PAY_REVIEW_BODY_MODE="Stripe ha registrato un pagamento in modalita' diversa da quella del plugin (test/produzione) per la prenotazione n. %7$d (%3$s, %4$s, %1$s alle %2$s, %5$s). NON e' stata confermata. Controlla la modalita' e le chiavi nelle opzioni del plugin (rif. %6$s)."
PLG_SYSTEM_WEBGBOOKING_PAY_REVIEW_BODY_ORPHAN="Stripe ha incassato %5$s da %3$s (%4$s) per la prenotazione n. %7$d del %1$s alle %2$s, ma quella prenotazione non era piu' in attesa (annullata dall'admin mentre il cliente pagava). Il pagamento e' registrato sulla riga: rimborsa a mano da Stripe (rif. %6$s) oppure ricrea l'appuntamento."
PLG_SYSTEM_WEBGBOOKING_ALERT_ORPHAN_SUBJECT="DA GESTIRE: pagamento Stripe senza prenotazione"
PLG_SYSTEM_WEBGBOOKING_ALERT_ORPHAN_BODY="Stripe ha incassato un pagamento per la sessione %1$s (rif. %2$s, importo %3$s, cliente %4$s) ma non esiste piu' nessuna prenotazione collegata (eliminata dall'admin mentre il cliente pagava). Rimborsa a mano da Stripe o contatta il cliente."
PLG_SYSTEM_WEBGBOOKING_ALERT_PRICE_SUBJECT="WebG Booking: prezzo di un elemento non valido"
PLG_SYSTEM_WEBGBOOKING_ALERT_PRICE_BODY="Un elemento booking ha un prezzo o una valuta che non si riesce a leggere in modo univoco (es. 49.999, oppure una valuta diversa da EUR, USD, GBP, CHF). Le sue prenotazioni sono bloccate finche' non lo correggi."
PLG_SYSTEM_WEBGBOOKING_ALERT_KEYMODE_SUBJECT="WebG Booking: chiave Stripe e modalita' non coincidono"
PLG_SYSTEM_WEBGBOOKING_ALERT_KEYMODE_BODY="La chiave segreta Stripe e' di un modo (test o produzione) diverso da quello impostato nel plugin: i pagamenti sono rifiutati. Correggi nelle opzioni del plugin, scheda Payments."
PLG_SYSTEM_WEBGBOOKING_ALERT_HOLDS_SUBJECT="WebG Booking: tetto di pagamenti in attesa raggiunto"
PLG_SYSTEM_WEBGBOOKING_ALERT_HOLDS_BODY="Ci sono %d slot tenuti in attesa di pagamento: nuove richieste a pagamento sono rifiutate finche' non scadono. Se non e' un picco di richieste vere, qualcuno sta provando a bloccare il calendario."
PLG_SYSTEM_WEBGBOOKING_TOO_MANY="Troppe richieste ravvicinate: riprova tra qualche minuto."
PLG_SYSTEM_WEBGBOOKING_PRICE_INVALID="Il prezzo di questo evento non e' configurato correttamente: le prenotazioni sono sospese."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_MODE_ERROR="La chiave segreta e' di tipo "_QQ_"%1$s"_QQ_" ma la modalita' scelta e' "_QQ_"%2$s"_QQ_": NON salvate (restano le impostazioni precedenti). Scegli la modalita' giusta o la chiave giusta."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_OK_RESTRICTED="Chiave limitata Stripe verificata (puo' leggere le sessioni di Checkout)."
PLG_SYSTEM_WEBGBOOKING_PAY_KEY_UNVERIFIABLE="Salvata, ma Stripe non permette a questa chiave limitata di essere verificata (nessun permesso di lettura). Funziona solo se ha il permesso Checkout Sessions in scrittura: prova con un pagamento di prova."
PLG_SYSTEM_WEBGBOOKING_EPOCH_BUMPED="Configurazioni in cache invalidate (versione %d): le pagine gia' generate smettono di prenotare finche' non vengono rigenerate. Svuota la cache della pagina (e Cloudflare)."
PLG_SYSTEM_WEBGBOOKING_LIMIT_IP_LABEL="Prenotazioni per indirizzo IP all'ora"
PLG_SYSTEM_WEBGBOOKING_LIMIT_IP_DESC="Oltre questo numero lo stesso indirizzo viene rifiutato per un'ora. L'IP non viene salvato, solo una sua impronta."
PLG_SYSTEM_WEBGBOOKING_HOLDS_IP_LABEL="Slot in attesa di pagamento per IP"
PLG_SYSTEM_WEBGBOOKING_HOLDS_IP_DESC="Quanti pagamenti aperti puo' avere lo stesso indirizzo contemporaneamente."
PLG_SYSTEM_WEBGBOOKING_HOLDS_MAX_LABEL="Tetto di slot in attesa di pagamento"
PLG_SYSTEM_WEBGBOOKING_HOLDS_MAX_DESC="Tetto globale di slot tenuti: oltre, le nuove richieste a pagamento sono rifiutate e ti arriva un avviso (protegge dal blocco del calendario)."
PLG_SYSTEM_WEBGBOOKING_GTM_LABEL="Google Tag Manager (GTM-XXXX)"
PLG_SYSTEM_WEBGBOOKING_GTM_DESC="Facoltativo. Serve solo alla pagina di ritorno di Stripe quando l'elemento NON ha una pagina grazie: ci carica il tuo contenitore GTM cosi' l'evento di prenotazione completata (con valore e valuta) parte comunque."
PLG_SYSTEM_WEBGBOOKING_GA4_LABEL="Google Analytics 4 (G-XXXX)"
PLG_SYSTEM_WEBGBOOKING_GA4_DESC="Facoltativo, alternativa a GTM per la pagina di ritorno senza pagina grazie."
PLG_SYSTEM_WEBGBOOKING_EPOCH_LABEL="Versione delle configurazioni"
PLG_SYSTEM_WEBGBOOKING_EPOCH_DESC="Numero corrente (sola lettura). Ogni pagina porta una configurazione firmata con questa versione."
PLG_SYSTEM_WEBGBOOKING_BUMP_LABEL="Invalida le configurazioni in cache al salvataggio"
PLG_SYSTEM_WEBGBOOKING_BUMP_DESC="Mettilo su Si e salva ogni volta che cambi il PREZZO di un elemento (o lo passi da gratis a pagamento): le copie della pagina in cache smettono di prenotare con la configurazione vecchia. Poi svuota la cache."
PLG_SYSTEM_WEBGBOOKING_TTL_LABEL="Durata massima di una configurazione (giorni)"
PLG_SYSTEM_WEBGBOOKING_TTL_DESC="Rete di sicurezza: una pagina in cache piu' vecchia di questo non prenota piu' (il cliente vede 'ricarica la pagina'). 30 giorni sopravvivono anche a una regola Cloudflare mensile; 0 = nessun limite."
