PLG_SYSTEM_WEBGBOOKING_EL_COMMA_SEPARATED_NUMERIC_IDS="ID numerici separati da virgola, es. 7 oppure 7,12. Un cliente viene aggiunto a queste liste SOLO se spunta la casella newsletter (attiva \"Consenso newsletter\" in Contenuto) E conferma con il double opt-in di Brevo (imposta il modello qui sotto). Il contatto non viene mai tolto da altre liste. Vuoto = nessuna lista."
