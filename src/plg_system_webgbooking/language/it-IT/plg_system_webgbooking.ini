PLG_SYSTEM_WEBGBOOKING_EL_HOW_LONG_BEFORE_THE="Quanto tempo prima dell'appuntamento, separati da virgola: <code>24h, 1h</code> (anche 30m, 2d; un numero da solo = ore). Vuoto = le opzioni del plugin (predefinito 24h, 1h)."
