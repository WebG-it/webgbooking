PLG_SYSTEM_WEBGBOOKING_EL_OPTIONAL_NUMBERS_SEPARATED_BY="Facoltativo: numeri separati da virgole, domenica = 0, lunedì = 1 ... sabato = 6 (es. <code>2,4</code> = martedì e giovedì). Vuoto = i giorni di lavoro del plugin."
