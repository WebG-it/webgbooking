# Da salvare come .github/workflows/secret-scan.yml in ogni repo PUBBLICO di WebG-it.
# Rifiuta (check rosso) push e pull request che contengono segreti, scansionando tutta la storia.
# Stesso schema gia' in uso in WebG-it/webg-voice.
name: Scansione segreti

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installa gitleaks 8.30.1 (verificato con SHA-256)
        env:
          VERSIONE: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          FILE="gitleaks_${VERSIONE}_linux_x64.tar.gz"
          curl -fsSL -o "$FILE" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSIONE}/${FILE}"
          echo "${SHA256}  ${FILE}" | sha256sum -c -
          tar -xzf "$FILE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scansione della storia
        run: gitleaks git . --redact --no-banner
